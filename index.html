<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemicraft — The Interactive Element Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="topbar">
    <button id="openToolbar" class="btn">⚗️ Elements</button>
    <button id="openSettings" class="btn">⚙️ Settings</button>
    <button id="clearBoard" class="btn">🧹 Clear</button>
  </div>

  <!-- MAIN PLAY AREA -->
  <div id="board"></div>

  <!-- TOOLBAR -->
  <div id="toolbar" class="panel">
    <div class="panel-header">
      <input id="search" type="text" placeholder="Search element...">
      <select id="category">
        <option value="All">All</option>
        <option value="Elements">Elements</option>
        <option value="Compounds">Compounds</option>
      </select>
    </div>
    <div id="elementGrid"></div>
  </div>

  <!-- SETTINGS -->
  <div id="settingsPanel" class="panel">
    <h2>Settings & Tips</h2>
    <label><input type="checkbox" id="soundToggle"> Enable Sound</label><br>
    <label><input type="checkbox" id="tipsToggle"> Show Tips</label>
    <div class="tips-section">
      <h3>💡 Tips</h3>
      <ul>
        <li>Drag and drop two items together to see if they react!</li>
        <li>Combine base elements like Hydrogen + Oxygen → Water.</li>
        <li>Unlock new compounds to expand your knowledge and inventory!</li>
        <li>Use "Clear" to reset your lab board.</li>
      </ul>
    </div>
  </div>

  <!-- ACHIEVEMENTS -->
  <div id="achievements" class="panel">
    <h2>Achievements</h2>
    <div id="discoveredList"></div>
  </div>

  <!-- NOTIFICATION -->
  <div id="notif"></div>

  <script src="data.js"></script>
  <script src="logic.js"></script>
</body>
</html>
